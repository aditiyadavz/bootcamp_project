# Continuous integration: runs on every push and pull request.
# Render deploys a new version only after these checks pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install packages
        run: |
          npm ci
          npm ci --prefix client

      - name: Build the React website
        run: npm run build --prefix client

      - name: API and real-time tests
        run: npm test

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Keep the browser test report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t submittrack:ci .
      - name: Check the container starts and refuses to run without settings
        run: |
          set +e
          docker run --rm submittrack:ci
          code=$?
          echo "Exit code without settings: $code"
          test "$code" -eq 1
