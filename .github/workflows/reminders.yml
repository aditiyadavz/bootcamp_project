# Scheduled job: every day at 9:00 India time, ask the live app to send deadline reminders.
# It needs two repository secrets: APP_URL (the Render address) and CRON_SECRET (the same value as on Render).
name: Deadline reminders

on:
  schedule:
    - cron: '30 3 * * *' # 03:30 UTC = 09:00 IST
  workflow_dispatch: # Also allows a manual run from the Actions tab.

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the reminder endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Add the APP_URL and CRON_SECRET repository secrets first."
            exit 1
          fi
          # The free Render service may be asleep, so allow time for it to wake up.
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 120 \
            -X POST "$APP_URL/api/reminders/run" \
            -H "Authorization: Bearer $CRON_SECRET"
